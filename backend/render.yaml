services:
  - type: web
    name: learnpilot-ai-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt && python scripts/init_sqlite_demo.py
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_MODE
        value: sqlite
      - key: SQLITE_DATABASE_URL
        value: sqlite:///./learning_agent_demo.db
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: USE_ML_SERVICE
        value: false
      - key: CORS_ORIGINS
        value: "*"
